<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="650" viewBox="0 0 1040 650" role="img" aria-labelledby="title desc">
<title id="title">文档查找条设计示意</title><desc id="desc">中文查找条展示匹配计数、替换范围、正则错误和新文档加载状态。静态设计图，未接入MyIDE。</desc>
<style>text{font-family:'Segoe UI','Microsoft YaHei',sans-serif;fill:#b8b8b8;font-size:14px}.h{font-size:21px;fill:#e4e4e4;font-weight:600}.label{fill:#e4e4e4;font-size:16px}.dim{fill:#949494;font-size:12px}.accent{fill:#69b6ee}.error{fill:#edb484}.chip{fill:#232323;stroke:#414141}.input{fill:#212121;stroke:#505050}.panel{fill:#171717;stroke:#303030}.line{fill:none;stroke:#b8b8b8;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1040" height="650" fill="#121212"/>
<text x="28" y="38" class="h">文档内查找与替换 · 顶部查找条提案</text>
<text x="28" y="64" class="dim">静态设计示意 · 尚未接入产品 · 默认查当前内存正文，范围与对象始终可见</text>
<g transform="translate(28 90)">
<rect width="984" height="166" rx="7" class="panel"/>
<text x="18" y="30" class="label">docs / 方案.md</text><text x="740" y="30" class="dim">当前正文 · 3 处匹配</text>
<rect x="18" y="47" width="370" height="34" rx="4" class="input"/><text x="30" y="69">alpha</text>
<text x="410" y="69" class="accent">2 / 3</text>
<rect x="476" y="47" width="34" height="34" rx="4" class="chip"/><path d="M486 66l7-7 7 7" class="line"/>
<rect x="518" y="47" width="34" height="34" rx="4" class="chip"/><path d="M528 60l7 7 7-7" class="line"/>
<rect x="575" y="47" width="48" height="34" rx="4" class="chip"/><text x="589" y="69">Aa</text>
<rect x="631" y="47" width="60" height="34" rx="4" class="chip"/><text x="647" y="69">整词</text>
<rect x="699" y="47" width="48" height="34" rx="4" class="chip"/><text x="714" y="69">.*</text>
<rect x="765" y="47" width="190" height="34" rx="4" class="chip"/><text x="780" y="69">范围：当前文档</text>
<rect x="18" y="94" width="370" height="34" rx="4" class="input"/><text x="30" y="116">替换为：beta</text>
<rect x="410" y="94" width="104" height="34" rx="4" class="chip"/><text x="429" y="116">替换当前</text>
<rect x="526" y="94" width="146" height="34" rx="4" class="chip"/><text x="546" y="116">全部替换 3 处</text>
<text x="18" y="150" class="dim">仅修改内存文档 · 一次撤销可还原 · 保存/自动保存继续走已有版本保护</text>
</g>
<g transform="translate(28 274)">
<rect width="984" height="96" rx="7" class="panel"/>
<text x="18" y="28" class="label">选区范围</text>
<rect x="18" y="42" width="370" height="34" rx="4" class="input"/><text x="30" y="64">alpha</text>
<text x="410" y="64" class="accent">1 / 2</text><text x="575" y="64">范围：第 12–18 行 · 选区</text>
<text x="790" y="64" class="dim">改选范围需明确确认</text>
</g>
<g transform="translate(28 388)">
<rect width="984" height="94" rx="7" class="panel"/>
<text x="18" y="28" class="label">正则错误</text>
<rect x="18" y="42" width="370" height="34" rx="4" fill="#212121" stroke="#edb484"/><text x="30" y="64">[</text>
<text x="410" y="64" class="error">正则无效：缺少 ]。不会执行替换。</text>
<rect x="797" y="42" width="158" height="34" rx="4" class="chip"/><text x="815" y="64" class="dim">全部替换（不可用）</text>
</g>
<g transform="translate(28 500)">
<rect width="984" height="108" rx="7" class="panel"/>
<text x="18" y="29" class="label">正在载入 b.js</text><text x="740" y="29" class="dim">查找与替换暂不可用</text>
<text x="18" y="59">上次文档 a.js（只读）</text>
<text x="18" y="85" class="dim">内容就绪后绑定 b.js；失败保留错误和重试入口，不能在 b.js 标签下替换 a.js。</text>
</g>
</svg>
