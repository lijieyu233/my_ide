<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MyIDE 图片阅读设计样机</title>
<style>
:root{color-scheme:dark;--bg:#171b20;--panel:#20262d;--border:#36414c;--text:#dce5eb;--muted:#94a4b1;--accent:#7dc5ba;font:14px/1.5 "Segoe UI","Microsoft YaHei",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);height:100dvh;display:flex;flex-direction:column}button,select{font:inherit;color:inherit;background:transparent;border:1px solid transparent;border-radius:5px;padding:5px 9px;cursor:pointer}button:hover,select{background:#2b343e}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button:disabled{opacity:.35;cursor:default}button[aria-pressed=true]{background:#2e4947;color:#b2e9df;border-color:#47706c}svg.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}header{padding:12px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);gap:12px}header strong{font-size:15px}small,.muted{color:var(--muted)}.badge{font-size:12px;color:#a6b6c3;border:1px solid var(--border);padding:3px 8px;border-radius:4px}.tabs{display:flex;padding:7px 20px;gap:7px;border-bottom:1px solid var(--border)}.tabs button{border:1px solid var(--border);min-width:130px;text-align:left}.toolbar{padding:9px 20px;display:flex;align-items:center;gap:5px;border-bottom:1px solid var(--border);flex-wrap:wrap;background:var(--panel)}.sep{height:20px;width:1px;background:var(--border);margin:0 8px}.pct{width:74px;background:#151c23;border:1px solid var(--border);text-align:center;font:inherit;color:var(--text);padding:5px;border-radius:4px}.reading{flex:1;display:flex;min-height:0}.stage{flex:1;min-width:0;overflow:auto;display:flex;padding:24px;background:#151a20;cursor:grab;touch-action:none}.stage.panning{cursor:grabbing}.picture{position:relative;flex-shrink:0;margin:auto;box-shadow:0 4px 24px #0005;background-color:#f0f2f4}.picture.checker{background-color:#dce2e7;background-image:conic-gradient(#bac4cd 25%,transparent 0 50%,#bac4cd 0 75%,transparent 0);background-size:24px 24px}.picture.dark{background:#26333d}.picture img{position:absolute;left:50%;top:50%;max-width:none;user-select:none;pointer-events:none}.picture.pixel img{image-rendering:pixelated}.info{width:235px;flex-shrink:0;overflow:auto;background:var(--panel);border-left:1px solid var(--border);padding:20px}.info[hidden]{display:none}.info h2{font-size:14px;margin:0 0 18px}.info dl{margin:0}.info dt{font-size:12px;color:var(--muted);margin-top:16px}.info dd{margin:4px 0;overflow-wrap:anywhere}.note{margin-top:24px;color:var(--muted);font-size:12px}.foot{padding:8px 20px;border-top:1px solid var(--border);font-size:12px;display:flex;justify-content:space-between;gap:10px}.status{color:var(--accent)}.error{display:none;margin:auto;text-align:center;color:var(--text);padding:32px}.stage.failed .picture{display:none}.stage.failed .error{display:block}.stage.failed{cursor:default}.error h2{font-size:18px}.error button{margin-top:12px;background:#314743;border-color:#496e66}.mobile{display:none}dialog{position:fixed;inset:0;max-width:none;max-height:none;width:100vw;height:100dvh;margin:0;padding:0;border:0;background:#13191f;color:var(--text)}dialog::backdrop{background:#000b}dialog[open]{display:flex;flex-direction:column}.dialog-head{padding:12px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}.fs-stage{flex:1;min-height:0}.fs-stage .picture{box-shadow:none}.fs-footer{padding:12px 20px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border)}
@media(max-width:760px){header,.tabs,.toolbar{padding-left:12px;padding-right:12px}.info{width:190px}.info:not([hidden]){position:absolute;right:0;top:170px;bottom:36px;z-index:3;box-shadow:-8px 0 20px #0005}.badge{display:none}.sep{margin:0 3px}.toolbar{gap:2px}.toolbar button{padding:5px 6px}.foot .muted{display:none}.tabs button{min-width:0;flex:1}.stage{padding:14px}}
</style>
<header><div><strong>图片阅读</strong> <small> / 设计样机 · 内存样例，未接入 MyIDE</small></div><span class="badge">只读 · 不修改原文件</span></header>
<nav class="tabs" aria-label="同文件夹样例"><button data-file="0" aria-pressed="true">diagram.svg</button><button data-file="1" aria-pressed="false">layout.svg</button></nav>
<div class="toolbar" aria-label="图片阅读工具">
<button id="previous" aria-label="上一张图片" title="当前样例集合中的上一张"><svg class="ic" viewBox="0 0 16 16"><path d="m10 3-5 5 5 5"/></svg></button><span id="position" class="muted">1 / 2</span><button id="next" aria-label="下一张图片"><svg class="ic" viewBox="0 0 16 16"><path d="m6 3 5 5-5 5"/></svg></button><span class="sep"></span>
<button id="minus" aria-label="缩小"><svg class="ic" viewBox="0 0 16 16"><path d="M3 8h10"/></svg></button><input id="scale" class="pct" aria-label="缩放百分比" inputmode="decimal" value="100%"><button id="plus" aria-label="放大"><svg class="ic" viewBox="0 0 16 16"><path d="M3 8h10M8 3v10"/></svg></button><button id="fit" aria-pressed="true">适应</button><button id="actual">1:1</button><span class="sep"></span>
<button id="rotate" title="仅旋转视图，不写回文件"><svg class="ic" viewBox="0 0 16 16"><path d="M3 6a5 5 0 1 1 0 4M3 2v4h4"/></svg> 旋转视图</button><select id="background" aria-label="图片背景"><option value="checker">透明棋盘</option><option value="white">白色背景</option><option value="dark">深色背景</option></select><button id="pixel" aria-pressed="false" title="只改变放大时的插值显示">像素显示</button><button id="info" aria-expanded="true">图片信息</button><button id="fullscreen"><svg class="ic" viewBox="0 0 16 16"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg> 全屏</button>
</div>
<main class="reading"><div id="stage" class="stage" tabindex="0" aria-label="图片阅读区域"><div id="picture" class="picture checker"><img id="image" draggable="false" alt="架构图样例"></div><section class="error" role="alert"><h2>图片未能加载</h2><div class="muted">此处模拟读取失败，原文件未被修改。</div><button id="retry">重试样例</button></section></div><aside id="details" class="info"><h2>图片信息 <small>· 样例值</small></h2><dl><dt>文件</dt><dd id="fileName">diagram.svg</dd><dt>原始尺寸</dt><dd>1200 × 900</dd><dt>格式 / 样例字节数</dt><dd id="bytes"></dd><dt>当前视图</dt><dd id="viewInfo">适应窗口</dd><dt>作用范围</dt><dd>旋转与背景只改变阅读视图</dd></dl><p class="note">切换样例保留各自的缩放与阅读位置。正式产品需接入文档身份与外部版本，样机只使用内存。</p><button id="fail" title="模拟错误状态，未读取真实文件">模拟加载失败</button></aside></main>
<footer class="foot"><span id="status" class="status" role="status" aria-live="polite">适应窗口</span><span class="muted">滚轮滚动 · Ctrl+滚轮缩放 · 拖动平移 · 双击适应 / 1:1</span></footer>
<dialog id="dialog" aria-label="图片全屏阅读"><div class="dialog-head"><strong id="fsName">diagram.svg</strong><button id="close" autofocus aria-label="关闭全屏">关闭 · Esc</button></div><div id="fsStage" class="stage fs-stage" tabindex="0" aria-label="全屏图片阅读区域"></div><div class="fs-footer"><span id="fsStatus"></span><span>＋ / － 缩放 · 0 适应 · 1 原始像素</span></div></dialog>
<script>
const $=id=>document.getElementById(id);
const iconCard=(x,y,label,color)=>`<g><rect x="${x}" y="${y}" width="280" height="100" rx="14" fill="${color}"/><text x="${x+140}" y="${y+60}" text-anchor="middle" font-family="Segoe UI,Microsoft YaHei" font-size="28" fill="#172c35">${label}</text></g>`;
function illustration(second){return `<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><rect x="75" y="75" width="1050" height="750" rx="28" fill="#eef4f5" fill-opacity=".92"/><text x="125" y="150" font-family="Segoe UI,Microsoft YaHei" font-size="40" fill="#294652">${second?'界面模块 · 样例':'文档工作流 · 样例'}</text><text x="125" y="196" font-family="Segoe UI,Microsoft YaHei" font-size="20" fill="#607d88">SVG 阅读示意 / 透明区域位于外缘</text><path d="M460 335H620M760 385V475M620 525H460M320 385V475" stroke="#648793" stroke-width="4" fill="none"/><path d="m606 322 14 13-14 13M747 461l13 14 13-14M474 512l-14 13 14 13" stroke="#648793" stroke-width="4" fill="none"/>${iconCard(180,285,second?'文件导航':'打开文档','#9bccbf')}${iconCard(620,285,second?'编辑与预览':'阅读与编辑','#b3d4e3')}${iconCard(620,475,second?'工具与反馈':'保存与恢复','#c7d0e7')}${iconCard(180,475,second?'状态与帮助':'返回原位置','#e2ceaa')}<rect x="125" y="665" width="950" height="90" rx="14" fill="#dce6e8"/><text x="165" y="720" font-family="Segoe UI,Microsoft YaHei" font-size="22" fill="#3e5c67">只读旋转 / 背景与缩放不会修改 SVG 内容</text></svg>`;}
const samples=[{name:'diagram.svg',svg:illustration(false)},{name:'layout.svg',svg:illustration(true)}];
const states=samples.map(()=>({mode:'fit',scale:1,angle:0,left:0,top:0,failed:false}));let index=0,full=false,background='checker',pixel=false;let activeStage=$('stage');const picture=$('picture'),image=$('image');
const state=()=>states[index],clamp=s=>Math.max(.05,Math.min(16,s));
function saveScroll(){if(index<0)return;state().left=activeStage.scrollLeft;state().top=activeStage.scrollTop;}
function dimensions(){return state().angle%180?{w:900,h:1200}:{w:1200,h:900};}
function fitScale(){const d=dimensions(),pad=parseFloat(getComputedStyle(activeStage).paddingLeft)*2;return clamp(Math.min(1,(activeStage.clientWidth-pad-4)/d.w,(activeStage.clientHeight-pad-4)/d.h));}
function render(){const s=state(),d=dimensions();if(s.mode==='fit')s.scale=fitScale();picture.style.width=Math.round(d.w*s.scale)+'px';picture.style.height=Math.round(d.h*s.scale)+'px';image.style.width=Math.round(1200*s.scale)+'px';image.style.height=Math.round(900*s.scale)+'px';image.style.transform=`translate(-50%,-50%) rotate(${s.angle}deg)`;picture.className='picture '+background+(pixel?' pixel':'');activeStage.classList.toggle('failed',s.failed);$('scale').value=Math.round(s.scale*100)+'%';$('fit').setAttribute('aria-pressed',s.mode==='fit');const message=`${s.mode==='fit'?'适应窗口':'自由缩放'} · ${Math.round(s.scale*100)}% · 视图旋转 ${s.angle}°`;$('viewInfo').textContent=message;$('status').textContent=s.failed?'加载失败 · 可重试':message;$('fsStatus').textContent=message;for(const id of ['minus','plus','fit','actual','rotate','pixel','fullscreen'])$(id).disabled=s.failed;$('scale').disabled=s.failed;}
function changeScale(scale,event){const before=picture.getBoundingClientRect(),rx=event?(event.clientX-before.left)/before.width:.5,ry=event?(event.clientY-before.top)/before.height:.5;const s=state();s.mode='free';s.scale=clamp(scale);render();if(event){const after=picture.getBoundingClientRect();activeStage.scrollLeft+=after.left+rx*after.width-event.clientX;activeStage.scrollTop+=after.top+ry*after.height-event.clientY;}saveScroll();}
function fit(){state().mode='fit';state().left=state().top=0;render();activeStage.scrollLeft=activeStage.scrollTop=0;}
function changeFile(next){if(full||next===index||next<0||next>=samples.length)return;saveScroll();index=next;image.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(samples[index].svg);image.alt=samples[index].name+' 阅读样例';$('fileName').textContent=samples[index].name;$('bytes').textContent='SVG · '+(new Blob([samples[index].svg]).size/1024).toFixed(1)+' KB';$('position').textContent=(index+1)+' / '+samples.length;$('previous').disabled=index===0;$('next').disabled=index===samples.length-1;document.querySelectorAll('[data-file]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.file===index));render();requestAnimationFrame(()=>{activeStage.scrollLeft=state().left;activeStage.scrollTop=state().top;});}
document.querySelectorAll('[data-file]').forEach(b=>b.onclick=()=>changeFile(+b.dataset.file));$('previous').onclick=()=>changeFile(index-1);$('next').onclick=()=>changeFile(index+1);$('minus').onclick=()=>changeScale(state().scale/1.25);$('plus').onclick=()=>changeScale(state().scale*1.25);$('fit').onclick=fit;$('actual').onclick=()=>changeScale(1);$('rotate').onclick=()=>{state().angle=(state().angle+90)%360;fit();};$('background').onchange=e=>{background=e.target.value;render();};$('pixel').onclick=()=>{pixel=!pixel;$('pixel').setAttribute('aria-pressed',pixel);render();};$('info').onclick=()=>{$('details').hidden=!$('details').hidden;$('info').setAttribute('aria-expanded',!$('details').hidden);render();};$('scale').onchange=e=>{const n=Number(e.target.value.replace('%',''));if(Number.isFinite(n)&&n>0)changeScale(n/100);else{render();$('status').textContent='请输入 5–1600 的缩放百分比';}};
$('fail').onclick=()=>{state().failed=true;render();};$('retry').onclick=()=>{state().failed=false;render();};
let drag=null;for(const stage of [$('stage'),$('fsStage')]){stage.addEventListener('wheel',e=>{if(e.ctrlKey||e.metaKey){e.preventDefault();changeScale(state().scale*(e.deltaY<0?1.25:.8),e);}},{passive:false});stage.addEventListener('dblclick',()=>{if(state().mode==='fit')changeScale(1);else fit();});stage.addEventListener('pointerdown',e=>{if(state().failed||e.button!==0||stage.scrollWidth<=stage.clientWidth&&stage.scrollHeight<=stage.clientHeight)return;drag={x:e.clientX,y:e.clientY,left:stage.scrollLeft,top:stage.scrollTop};stage.setPointerCapture(e.pointerId);stage.classList.add('panning');});stage.addEventListener('pointermove',e=>{if(drag){stage.scrollLeft=drag.left-e.clientX+drag.x;stage.scrollTop=drag.top-e.clientY+drag.y;}});const end=()=>{drag=null;stage.classList.remove('panning');saveScroll();};stage.addEventListener('pointerup',end);stage.addEventListener('pointercancel',end);stage.addEventListener('scroll',saveScroll,{passive:true});}
let entry=null;$('fullscreen').onclick=()=>{saveScroll();entry={...state()};full=true;activeStage=$('fsStage');activeStage.append(picture);$('fsName').textContent=samples[index].name;$('dialog').showModal();render();requestAnimationFrame(()=>{activeStage.scrollLeft=entry.left;activeStage.scrollTop=entry.top;});};
function closeFullscreen(){if(!full)return;$('dialog').close();full=false;activeStage=$('stage');activeStage.prepend(picture);Object.assign(state(),entry);render();requestAnimationFrame(()=>{activeStage.scrollLeft=entry.left;activeStage.scrollTop=entry.top;$('fullscreen').focus();});}
$('close').onclick=closeFullscreen;$('dialog').addEventListener('cancel',e=>{e.preventDefault();closeFullscreen();});$('dialog').addEventListener('keydown',e=>{if(e.key==='Tab'){const stops=[$('close'),$('fsStage')];const at=stops.indexOf(document.activeElement);e.preventDefault();stops[(at+(e.shiftKey?-1:1)+stops.length)%stops.length].focus();return;}if(e.ctrlKey||e.metaKey||e.altKey||e.isComposing)return;if(['+','=','-','_','0','1'].includes(e.key)){e.preventDefault();if(e.key==='0')fit();else if(e.key==='1')changeScale(1);else changeScale(state().scale*(['+','='].includes(e.key)?1.25:.8));}});
new ResizeObserver(()=>{if(state().mode==='fit')render();}).observe($('stage'));window.addEventListener('resize',()=>{if(state().mode==='fit')render();});
index=-1;changeFile(0);window.prototypeReady=true;window.prototypeState=()=>({index,full,active:document.activeElement.id,background,pixel,state:{...state()},scroll:{left:activeStage.scrollLeft,top:activeStage.scrollTop},imageRect:image.getBoundingClientRect().toJSON(),pictureRect:picture.getBoundingClientRect().toJSON()});
</script>
</html>
