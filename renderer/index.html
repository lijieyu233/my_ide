<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file: https: http:; frame-src 'self' data: about: file: http: https:;">
<title>My IDE</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="vendor/atom-one-dark.min.css">
</head>
<body>
<header id="toolbar">
  <button id="btn-open" class="tb-btn" title="打开项目 (Ctrl+O)"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.8 4h4l1.2 1.6h7.2v6.9a1 1 0 0 1-1 1H2.8a1 1 0 0 1-1-1z"/></svg>打开项目</button>
  <span class="tb-sep" aria-hidden="true"></span>
  <div id="project-bar-wrap">
    <!-- 「全部项目」入口由 app.js 注入到此层（在横向滚动容器之外 → 结构上不可能压住项目按钮） -->
    <div id="project-bar" title="已打开的项目，点击切换"></div>
  </div>
  <span class="spacer"></span>
  <span class="tb-sep" aria-hidden="true"></span>
  <button id="btn-search" class="tb-btn tb-ic" title="搜索内容 (Ctrl+Shift+F)"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.4"/><path d="M10.4 10.4L14 14"/></svg></button>
  <button id="btn-theme" class="tb-btn tb-ic" title="切换主题 (Ctrl+Shift+T)"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.4"/><path class="fill" d="M8 2.6a5.4 5.4 0 0 1 0 10.8z"/></svg></button>
  <button id="btn-settings" class="tb-btn tb-ic" title="设置 (Ctrl+Alt+S)"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.6 4.9h10.8M2.6 11.1h10.8"/><circle cx="6.3" cy="4.9" r="1.7"/><circle cx="9.9" cy="11.1" r="1.7"/></svg></button>
  <button id="btn-help" class="tb-btn tb-ic" title="帮助 (F1)"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.8"/><path d="M6.3 6.4a1.8 1.8 0 1 1 2.5 1.7c-.5.24-.75.6-.75 1.05v.3"/><circle class="fill" cx="8" cy="11.6" r=".85"/></svg></button>
  <span class="tb-sep" aria-hidden="true"></span>
  <span class="win-btns" title="窗口控制">
    <button id="win-min" class="tb-btn" title="最小化">─</button>
    <button id="win-max" class="tb-btn" title="最大化 / 还原">□</button>
    <button id="win-close" class="tb-btn win-close" title="关闭">✕</button>
  </span>
</header>
<div id="main">
  <div id="tool-strip" title="工具窗口（PyCharm 式）">
    <button id="tool-sidebar" class="tool-btn" title="收起 / 展开侧栏 (Ctrl+`)"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5L5.5 8l4.5 4.5"/></svg></button>
    <button id="tool-project" class="tool-btn active" title="项目文件 (Ctrl+1)"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><rect x="2.4" y="2.4" width="7.8" height="9.8" rx="1.2"/><path d="M5.4 13.4h7.2a1 1 0 0 0 1-1V4.6"/></svg></button>
    <button id="tool-outline" class="tool-btn" title="大纲 (Ctrl+2)"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.8 4.2h10.4M2.8 8h10.4M2.8 11.8h6.4"/></svg></button>
    <button id="tool-git" class="tool-btn" title="提交（Ctrl+K / Alt+0 / Ctrl+3 / Ctrl+4）"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><circle cx="4.2" cy="12" r="1.7"/><circle cx="4.2" cy="4" r="1.7"/><circle cx="11.8" cy="7" r="1.7"/><path d="M4.2 5.7v4.6M5.9 12h2.5a3.4 3.4 0 0 0 3.4-3.4v-.1"/></svg></button>
    <button id="tool-log" class="tool-btn" title="Git 日志 (Alt+9 / Ctrl+5)"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.6"/><path d="M8 1.6v3.8M8 10.6v3.8"/></svg></button>
    <button id="tool-browser" class="tool-btn" title="内置浏览器 (Ctrl+6)"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.8"/><path d="M2.2 8h11.6M8 2.2c1.9 2.1 1.9 9.5 0 11.6M8 2.2c-1.9 2.1-1.9 9.5 0 11.6"/></svg></button>
    <button id="tool-db" class="tool-btn" title="数据库 (Ctrl+7)"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><ellipse cx="8" cy="4" rx="5.2" ry="2.1"/><path d="M2.8 4v8c0 1.16 2.33 2.1 5.2 2.1s5.2-.94 5.2-2.1V4M2.8 8c0 1.16 2.33 2.1 5.2 2.1s5.2-.94 5.2-2.1"/></svg></button>
    <button id="tool-tasks" class="tool-btn" title="任务（清单 + 依赖图，Ctrl+9）"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><rect x="2.4" y="2.4" width="11.2" height="11.2" rx="2"/><path d="M5.2 8.2l1.9 1.9 3.8-4.2"/></svg></button>
  </div>
  <aside id="sidebar">
    <div id="panel-project">
      <div class="panel-title">项目</div>
      <div id="tree-head">
        <span class="tree-search-wrap">
          <svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.4"/><path d="M10.4 10.4L14 14"/></svg>
          <input id="tree-search" type="text" placeholder="搜索文件…" autocomplete="off" spellcheck="false" title="搜索项目内文件（回车跳转）">
        </span>
        <span class="tree-head-actions">
          <button id="tree-hide-mode" class="vt-btn hide-mode-btn hm-normal" title="三态切换：全部显示 / 不显示隐藏项 / 只看隐藏项">常规</button>
          <button id="tree-sort" class="vt-btn" title="排序"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 12.6V3.4M2.6 5.8L5 3.4l2.4 2.4M11 3.4v9.2M8.6 10.2L11 12.6l2.4-2.4"/></svg></button>
          <button id="tree-collapse" class="vt-btn" title="收起全部目录（PyCharm 式）"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><rect x="2.6" y="2.6" width="10.8" height="10.8" rx="2"/><path d="M5.6 8h4.8"/></svg></button>
          <button id="tree-expand" class="vt-btn" title="展开全部目录"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><rect x="2.6" y="2.6" width="10.8" height="10.8" rx="2"/><path d="M5.6 8h4.8M8 5.6v4.8"/></svg></button>
        </span>
      </div>
      <div id="tree"></div>
    </div>
    <div id="panel-outline" class="hidden">
      <div class="panel-title">大纲</div>
      <div id="outline"></div>
    </div>
    <!-- Git 提交工具窗口（PyCharm 式左侧停靠：上半变更文件树 · 下半提交信息；diff 显示在主编辑区） -->
    <div id="panel-git" class="hidden">
      <div class="panel-title">提交
        <span id="cd-branch" title="点击切换分支 / 检出标签"></span>
        <span id="cd-dirty"></span>
        <span class="panel-title-actions">
          <button id="cd-pull" class="vt-btn" title="拉取（fetch + fast-forward 合并 origin）"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.4v7.2M8 9.6L5 6.6M8 9.6l3-3M3.2 12.6h9.6"/></svg>拉取</button>
          <button id="cd-push" class="vt-btn" title="推送当前分支到 origin（先预览待推送提交）"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 9.6V2.4M8 2.4L5 5.4M8 2.4l3 3M3.2 12.6h9.6"/></svg>推送</button>
          <span class="tb-sep" aria-hidden="true"></span>
          <button id="cd-shelve" class="vt-btn" title="搁置更改（Shelve）：暂存未提交改动并可恢复"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><rect x="2.6" y="3.4" width="10.8" height="3" rx="1"/><path d="M3.6 6.4v5.6a1 1 0 0 0 1 1h6.8a1 1 0 0 0 1-1V6.4M6.6 9h2.8"/></svg></button>
          <button id="cd-remote" class="vt-btn" title="远程仓库管理（remote / 认证）"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M6.4 9.6a2.6 2.6 0 0 0 3.9.3l1.9-1.9a2.6 2.6 0 0 0-3.7-3.7l-1.1 1.1"/><path d="M9.6 6.4a2.6 2.6 0 0 0-3.9-.3L3.8 8a2.6 2.6 0 0 0 3.7 3.7l1.1-1.1"/></svg></button>
          <button id="cd-refresh" class="vt-btn" title="刷新 Git 状态 (Ctrl+R)"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.6-3.7M13 3.2v3.2H9.8"/></svg></button>
          <button id="cd-log" class="vt-btn" title="提交历史（Alt+9 / Ctrl+5）"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.6"/><path d="M8 4.8V8l2.2 1.4"/></svg></button>
        </span>
      </div>
      <div class="cd-files" id="cd-files"></div>
      <!-- 内嵌 diff 预览（PyCharm 式「预览」开关；固定主编辑区看整体，这里看行级细节） -->
      <div id="commit-preview" class="hidden">
        <div class="cp-head">
          <span id="cp-title" class="cp-title">预览</span>
          <span id="cp-stats" class="cp-stats"></span>
          <button id="cp-close" class="vt-btn" title="关闭预览">✕</button>
        </div>
        <div id="cp-body" class="cp-body"></div>
      </div>
      <div class="cd-msgbox">
        <div class="commit-amend-row">
          <label class="m-check" title="把这次改动追加到上一次提交，并自动回填上次的提交消息"><input type="checkbox" id="commit-amend"><span>修正上次提交 (Amend)</span></label>
          <button id="commit-history" class="vt-btn" title="提交消息历史（点击填充到输入框）"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.6"/><path d="M8 4.8V8l2.2 1.4"/></svg></button>
        </div>
        <textarea id="commit-msg" placeholder="提交消息" spellcheck="false"></textarea>
        <div class="commit-foot">
          <span id="commit-count"></span>
          <button class="tb-btn m-ok" id="cm-ok" title="提交 (Ctrl+Enter / Alt+I)">提交 (I)</button>
          <span class="m-split">
            <button class="tb-btn m-ok" id="cm-ok-push" title="提交并推送 (Ctrl+Shift+K / Alt+P)">提交并推送 (P)</button>
            <button class="tb-btn m-ok m-caret" id="cm-ok-push-menu" title="更多「提交并推送」选项（其他远程 / 强制推送）">▾</button>
          </span>
        </div>
      </div>
    </div>
    <div id="panel-db" class="hidden">
      <div class="panel-title">数据库</div>
      <div id="db-side-bar">
        <select id="db-conn-select" title="已保存的连接"></select>
        <button id="db-connect-btn" class="vt-btn" title="连接 / 断开">连接</button>
      </div>
      <div id="db-side-bar2">
        <button id="db-conn-edit" class="vt-btn" title="新建 / 编辑连接">✎</button>
        <button id="db-conn-del" class="vt-btn" title="删除已保存的连接">🗑</button>
        <button id="db-tables-refresh" class="vt-btn" title="刷新表列表">🔄</button>
      </div>
      <div id="db-status" class="db-st">未连接</div>
      <div class="db-side-head">表</div>
      <div id="db-tables"><div class="db-hint">连接后此处显示表列表</div></div>
    </div>
    <!-- 浏览器收藏（左侧栏面板，浏览器工具激活时显示；网页在主区，仿数据库双区联动） -->
    <div id="panel-browser" class="hidden">
      <div class="panel-title">收藏</div>
      <div class="bw-sb-head">
        <span>书签</span>
        <button id="bw-sb-add-folder" class="bw-sb-act" title="新建收藏文件夹">＋</button>
      </div>
      <div id="bw-sb-list"></div>
    </div>
    <!-- 任务工具窗口（侧栏清单；DAG 依赖图在主区 #tasks-dag-panel，Ctrl+9） -->
    <div id="panel-tasks" class="hidden">
      <div class="panel-title">任务
        <span id="tasks-count" title="已完成 / 总数"></span>
        <span class="panel-title-actions">
          <button id="tasks-vis" class="vt-btn" title="可见度：显示全部（点击切换）">◉</button>
          <button id="tasks-undo" class="vt-btn hidden" title="撤销最近一次删除">⟲</button>
          <button id="tasks-clear" class="vt-btn hidden" title="清理已完成链条（一键删除整链完成任务，可撤销）">⊘</button>
        </span>
      </div>
      <div id="tasks-filter-bar" title="清单过滤：只影响左侧清单展示，右侧依赖图不受影响">
        <input id="tasks-filter" type="text" placeholder="🔍 过滤任务标题…" spellcheck="false" autocomplete="off">
        <select id="tasks-filter-prio" title="按优先级筛选">
          <option value="all">全部优先级</option>
          <option value="high">高</option>
          <option value="normal">中</option>
          <option value="low">低</option>
        </select>
      </div>
      <div id="tasks-body"></div>
      <div id="tasks-new-bar">
        <input id="tasks-new-input" type="text" placeholder="+ 新任务，回车添加" spellcheck="false" autocomplete="off">
      </div>
    </div>
  </aside>
  <div id="sidebar-resizer" title="拖动调整目录区宽度"></div>
  <div id="content">
    <div id="bg-layer" aria-hidden="true"></div>
    <div id="tabbar"></div>
    <div id="viewer"></div>
    <div id="empty-state">
      <div class="empty-card">
        <div class="empty-head">
          <span class="empty-mark"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6L4 12l5 6M15 6l5 6-5 6"/></svg></span>
          <span class="empty-head-tx">
            <span class="empty-title">My IDE</span>
            <span class="empty-sub">私人定制轻量编辑器 · 选个项目目录开始</span>
          </span>
        </div>
        <div class="empty-keys">
          <span class="kbd-chip"><kbd>Ctrl+O</kbd>打开项目</span>
          <span class="kbd-chip"><kbd>Ctrl+P</kbd>快速打开</span>
          <span class="kbd-chip"><kbd>Ctrl+Shift+C</kbd>复制路径</span>
        </div>
        <button id="btn-open2" class="empty-cta"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.8 4h4l1.2 1.6h7.2v6.9a1 1 0 0 1-1 1H2.8a1 1 0 0 1-1-1z"/></svg>打开项目</button>
        <div id="empty-recent"></div>
      </div>
    </div>
    <div id="browser-panel" class="hidden">
      <div class="browser-toolbar">
        <button id="bw-back" class="vt-btn" title="后退 (Alt+←)">←</button>
        <button id="bw-fwd" class="vt-btn" title="前进 (Alt+→)">→</button>
        <button id="bw-reload" class="vt-btn" title="刷新 (Ctrl+R / F5)">⟳</button>
        <button id="bw-home" class="vt-btn" title="主页（必应搜索）">⌂</button>
        <div class="browser-url">
          <input id="bw-url" type="text" placeholder="输入网址或搜索关键词，回车打开…" spellcheck="false" autocomplete="off">
          <button id="bw-fav" class="bw-fav-btn" title="收藏 / 取消收藏当前页">☆</button>
        </div>
        <button id="bw-favs" class="vt-btn" title="收藏夹">📌</button>
        <button id="bw-close" class="vt-btn" title="关闭内置浏览器 (Ctrl+4)">✕</button>
        <div id="bw-dd" class="bw-dd hidden"></div>
      </div>
      <div class="browser-prog"><div id="bw-prog"></div></div>
      <div class="browser-body">
        <div class="browser-main">
          <div id="browser-view" class="hidden"></div>
          <div id="browser-error" class="hidden">
            <div class="be-icon">⚠️</div>
            <div class="be-title" id="bw-err-msg">页面加载失败</div>
            <div class="be-sub">检查网址或网络连接后重试</div>
            <button id="bw-err-retry" class="tb-btn big">⟳ 重试</button>
          </div>
          <div id="browser-empty">
            <div class="be-icon">🌐</div>
            <div class="be-title">内置浏览器</div>
            <div class="be-sub">在 IDE 内直接浏览网页 · 登录状态自动保留 · 新窗口链接用系统浏览器打开</div>
            <div class="be-section">收藏</div>
            <div class="be-chips" id="be-favs"></div>
            <div class="be-section">最近访问</div>
            <div class="be-list" id="be-history"></div>
          </div>
        </div>
      </div>
    </div>
    <!-- 数据库工具：数据表格 + SQL（右侧主区；连接与表列表在左侧 #panel-db）-->
    <div id="db-panel" class="hidden">
      <div class="db-tabs">
        <button id="db-tab-data" class="db-tab active">数据</button>
        <button id="db-tab-ddl" class="db-tab">结构</button>
        <button id="db-tab-er" class="db-tab">ER 图</button>
        <button id="db-tab-sql" class="db-tab">SQL</button>
        <span class="spacer"></span>
        <button id="db-close" class="vt-btn" title="收起数据库窗口 (Ctrl+5)">✕</button>
      </div>
      <div id="db-data-wrap">
        <div id="db-data"><div class="db-hint">选择左侧表查看数据</div></div>
      </div>
      <div id="db-ddl" class="hidden"></div>
      <div id="db-er" class="hidden"></div>
      <div id="db-sql" class="hidden"></div>
    </div>
    <!-- 任务依赖图（主区全宽：DAG 视图；侧栏清单保持显示可对照） -->
    <div id="tasks-dag-panel" class="hidden">
      <div class="db-tabs">
        <span class="tk-dag-title">⛓ 依赖图</span>
        <span id="tasks-dag-count" class="tk-dag-count"></span>
        <span class="spacer"></span>
        <span id="tasks-dag-zoom" class="tk-dag-zoom" title="画布缩放：Ctrl+滚轮（以光标为锚）">100%</span>
        <button id="tasks-dag-layout" class="vt-btn" title="布局：拓扑 / 泳道 / 甘特（点击选择模式）">⛓</button>
        <button id="tasks-dag-crit" class="vt-btn" title="关键路径：高亮最长依赖链（点击开启）">⛓</button>
        <button id="tasks-dag-ai" class="vt-btn" title="AI 分析：把任务数据交给 AI 找瓶颈、建议拆分（结果在右侧 AI 面板）">🤖</button>
        <button id="tasks-dag-fit" class="vt-btn" title="适应画布：缩放到全部可见并居中（打开任务工具时自动执行一次）">⛶</button>
        <button id="tasks-dag-focus" class="vt-btn hidden" title="退出聚焦"></button>
        <button id="tasks-dag-tidy" class="vt-btn" title="一键整理：清除全部手动位置，回到自动布局（依赖关系不变）">🧹 整理</button>
        <button id="tasks-dag-new" class="vt-btn" title="新建任务（也可双击图中空白处）">＋ 新建</button>
      </div>
      <div id="tasks-dag-body"></div>
    </div>
    <!-- Git 日志工具窗口（PyCharm Alt+9 / Ctrl+5，底部停靠：编辑器在上、日志在下） -->
    <div id="git-log-panel" class="hidden">
      <div id="gl-resizer" title="拖动调整高度"></div>
      <div class="gl-toolbar">
        <input id="gl-author" type="text" placeholder="👤 作者过滤…" spellcheck="false" autocomplete="off">
        <input id="gl-search" type="text" placeholder="🔍 消息 / 哈希…（/开头=正则）" spellcheck="false" autocomplete="off">
        <span id="gl-path-chip" class="hidden" title="文件历史过滤：仅显示改动该文件的提交"></span>
        <span class="gl-tb-count" id="gl-count"></span>
        <span class="spacer"></span>
        <button id="gl-compare" class="vt-btn" title="对比两个分支（独有提交 + 差异文件）">⇄</button>
        <button id="gl-refresh" class="vt-btn" title="刷新">🔄</button>
        <button id="gl-close" class="vt-btn" title="关闭 (Shift+Esc)">✕</button>
      </div>
      <div class="gl-body">
        <div id="gl-left">
          <div class="gl-left-head">
            <select id="gl-ref" title="分支过滤：所有 / 当前 / 指定分支"></select>
          </div>
          <div id="gl-list"></div>
        </div>
        <div id="gl-splitter" title="拖动调整左右宽度"></div>
        <div id="gl-right"></div>
      </div>
    </div>
  </div>
  <!-- AI 助手（右侧停靠对话窗口，PyCharm AI Assistant 式；#main 直接子元素，编辑区自动让位） -->
  <div id="ai-panel" class="hidden">
    <div id="ai-resize" title="拖动调整宽度"></div>
    <div class="ai-head">
      <span class="ai-title"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M6.4 1.8l1.1 2.9 2.9 1.1-2.9 1.1-1.1 2.9-1.1-2.9L2.4 5.8l2.9-1.1z"/><path d="M11.9 9l.65 1.75L14.3 11.4l-1.75.65L11.9 13.8l-.65-1.75L9.5 11.4l1.75-.65z"/></svg>AI 助手</span>
      <select id="ai-model" title="切换模型"></select>
      <span class="panel-title-actions">
        <button id="ai-perm" class="vt-btn" title="访问权限：写文件 / 执行命令放行到什么程度（可一次性预设，不必每次确认）"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.1l4.3 1.6v3.5c0 2.7-1.8 4.6-4.3 5.7-2.5-1.1-4.3-3-4.3-5.7V3.7z"/><path d="M6.2 7.9l1.3 1.3 2.5-2.6"/></svg></button>
        <button id="ai-history" class="vt-btn" title="历史会话（切换 / 重命名 / 删除）"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.6"/><path d="M8 4.9V8l2.2 1.5"/></svg></button>
        <button id="ai-undo" class="vt-btn" title="撤销最近一次 AI 写入（可连点回滚多步）"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.4 7.7a4 4 0 1 1 1.2 2.6"/><path d="M4.2 4.4v3.3h3.3"/></svg></button>
        <button id="ai-new" class="vt-btn" title="开始新对话（清空当前会话）"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.4v9.2M3.4 8h9.2"/></svg></button>
        <button id="ai-cfg" class="vt-btn" title="AI 模型配置"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.2"/><path d="M8 2v1.4M8 12.6V14M2 8h1.4M12.6 8H14M3.8 3.8l1 1M11.2 11.2l1 1M12.2 3.8l-1 1M4.8 11.2l-1 1"/></svg></button>
        <button id="ai-close" class="vt-btn" title="收起 AI 助手"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.2 4.2l7.6 7.6M11.8 4.2l-7.6 7.6"/></svg></button>
      </span>
    </div>
    <div id="ai-usage" class="ai-usage" title="上下文为字符数估算值；接入模型返回 usage 后显示精确统计"></div>
    <div id="ai-msgs"></div>
    <div class="ai-input-bar">
      <div id="ai-images" class="hidden"></div>
      <!-- 上下文就一条线：跟随的当前文件 / 固定项 / @ 引用都在这一行里横向滚动，
           不再「正在看」独占一行 + chips 换行 + 回形针按钮，贴着输入框堆三层。 -->
      <div id="ai-chips" class="hidden"></div>
      <div class="ai-input-row">
        <!-- 输入框与发送按钮是同一个卡片：按钮在框内右下角。
             以前是「两个并排的框」，多行输入时输入框长高、按钮留在 38px，高度看着就不齐。 -->
        <div class="ai-input-box">
          <textarea id="ai-input" rows="1" placeholder="描述你想怎么整理…（Enter 发送 / @ 引用文件 / / 命令 / 可直接贴图）" spellcheck="false"></textarea>
          <button id="ai-send" class="tb-btn m-ok" title="发送（Enter）">➤</button>
        </div>
      </div>
    </div>
  </div>
  <!-- 右侧工具窗口条（PyCharm 式：AI 助手等右侧停靠工具；Alt+` 收起/展开右侧栏） -->
  <div id="tool-strip-right" title="右侧工具窗口">
    <button id="tool-sidebar-r" class="tool-btn" title="收起 / 展开右侧栏 (Alt+`)"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5L10.5 8L6 12.5"/></svg></button>
    <button id="tool-ai" class="tool-btn" title="AI 助手 (Alt+1 / Ctrl+8)"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M6.4 1.8l1.1 2.9 2.9 1.1-2.9 1.1-1.1 2.9-1.1-2.9L2.4 5.8l2.9-1.1z"/><path d="M11.9 9l.65 1.75L14.3 11.4l-1.75.65L11.9 13.8l-.65-1.75L9.5 11.4l1.75-.65z"/></svg></button>
  </div>
</div>
<footer id="statusbar"><span id="sb-tool-font" class="sb-font" title="侧栏 / 工具窗口 / 右侧 AI 面板字号（目录树 · 大纲 · 提交 · 数据库 · 任务 · 依赖图 · Git 日志 · AI 对话）"><span class="sb-font-tag">侧栏</span><button id="sb-tf-dec" title="减小侧栏字号">−</button><span id="sb-tf-val">13</span><button id="sb-tf-inc" title="增大侧栏字号">＋</button></span><span class="sb-sep" aria-hidden="true"></span><span id="sb-ver" title="当前运行版本"></span><span id="sb-branch"></span><span id="sb-info"></span><span id="sb-font" class="sb-font" title="编辑区字号（Ctrl+= / Ctrl+-）"><span class="sb-font-tag">编辑</span><button id="sb-font-dec" title="减小字号">−</button><span id="sb-font-val">13</span><button id="sb-font-inc" title="增大字号">＋</button></span><span id="sb-bgop" title="背景图透明度（设置背景图后显示）"><input id="sb-bgop-range" type="range" min="5" max="50" step="1" value="15"></span></footer>
<div id="ctx-menu" class="hidden"></div>
