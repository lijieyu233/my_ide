<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file: https: http:; frame-src 'self' data: about: file: http: https:;">
<title>My IDE</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="vendor/atom-one-dark.min.css">
</head>
<body>
<header id="toolbar">
  <button id="btn-open" class="tb-btn" title="打开项目 (Ctrl+O)">⊞ 打开项目</button>
  <div id="project-bar" title="已打开的项目，点击切换"></div>
  <span class="spacer"></span>
  <button id="btn-search" class="tb-btn" title="搜索内容 (Ctrl+Shift+F)">⌕</button>
  <button id="btn-theme" class="tb-btn" title="切换主题 (Ctrl+Shift+T)">◑</button>
  <button id="btn-settings" class="tb-btn" title="设置 (Ctrl+Alt+S)">⚙</button>
  <button id="btn-help" class="tb-btn" title="帮助 (F1)">?</button>
  <span class="win-btns" title="窗口控制">
    <button id="win-min" class="tb-btn" title="最小化">─</button>
    <button id="win-max" class="tb-btn" title="最大化 / 还原">□</button>
    <button id="win-close" class="tb-btn win-close" title="关闭">✕</button>
  </span>
</header>
<div id="main">
  <div id="tool-strip" title="工具窗口（PyCharm 式）">
    <button id="tool-sidebar" class="tool-btn" title="收起 / 展开侧栏 (Ctrl+`)">⏴</button>
    <button id="tool-project" class="tool-btn active" title="项目文件 (Ctrl+1)">▤</button>
    <button id="tool-outline" class="tool-btn" title="大纲 (Ctrl+2)">☰</button>
    <button id="tool-git" class="tool-btn" title="Git (Ctrl+3)">⑂</button>
    <button id="tool-browser" class="tool-btn" title="内置浏览器 (Ctrl+4)">🌐</button>
  </div>
  <aside id="sidebar">
    <div id="panel-project">
      <div class="panel-title">项目</div>
      <div id="tree-head">
        <input id="tree-search" type="text" placeholder="🔍 搜索文件…" autocomplete="off" spellcheck="false" title="搜索项目内文件（回车跳转）">
        <span class="tree-head-actions">
          <button id="tree-font-dec" class="vt-btn" title="目录树字号减小">A−</button>
          <button id="tree-font-inc" class="vt-btn" title="目录树字号增大">A+</button>
          <button id="tree-hide-mode" class="vt-btn" title="三态切换：全部显示 / 不显示隐藏项 / 只看隐藏项">👁</button>
          <button id="tree-collapse" class="vt-btn" title="收起全部目录（PyCharm 式）">⊟</button>
          <button id="tree-expand" class="vt-btn" title="展开全部目录">⊞</button>
        </span>
      </div>
      <div id="tree"></div>
    </div>
    <div id="panel-outline" class="hidden">
      <div class="panel-title">大纲</div>
      <div id="outline"></div>
    </div>
    <div id="panel-git" class="hidden">
      <div id="git-branchbar"><span id="git-branch"></span></div>
      <div id="git-body"></div>
    </div>
  </aside>
  <div id="sidebar-resizer" title="拖动调整目录区宽度"></div>
  <div id="content">
    <div id="bg-layer" aria-hidden="true"></div>
    <div id="tabbar"></div>
    <div id="viewer"></div>
    <div id="empty-state">
      <div class="empty-icon">🛠</div>
      <div class="empty-title">My IDE</div>
      <div class="empty-hint">点击「打开项目」选择一个项目目录</div>
      <div class="empty-hint2">单击文件打开 · Ctrl+Shift+C 复制路径 · Ctrl+K 提交</div>
      <button id="btn-open2" class="tb-btn big">📂 打开项目</button>
      <div id="empty-recent"></div>
    </div>
    <div id="browser-panel" class="hidden">
      <div class="browser-toolbar">
        <button id="bw-back" class="vt-btn" title="后退 (Alt+←)">←</button>
        <button id="bw-fwd" class="vt-btn" title="前进 (Alt+→)">→</button>
        <button id="bw-reload" class="vt-btn" title="刷新 (Ctrl+R / F5)">⟳</button>
        <button id="bw-home" class="vt-btn" title="主页（必应搜索）">⌂</button>
        <div class="browser-url">
          <input id="bw-url" type="text" placeholder="输入网址或搜索关键词，回车打开…" spellcheck="false" autocomplete="off">
          <button id="bw-fav" class="bw-fav-btn" title="收藏 / 取消收藏当前页">☆</button>
        </div>
        <button id="bw-favs" class="vt-btn" title="收藏夹">📌</button>
        <button id="bw-close" class="vt-btn" title="关闭内置浏览器 (Ctrl+4)">✕</button>
        <div id="bw-dd" class="bw-dd hidden"></div>
      </div>
      <div class="browser-prog"><div id="bw-prog"></div></div>
      <div id="browser-view" class="hidden"></div>
      <div id="browser-error" class="hidden">
        <div class="be-icon">⚠️</div>
        <div class="be-title" id="bw-err-msg">页面加载失败</div>
        <div class="be-sub">检查网址或网络连接后重试</div>
        <button id="bw-err-retry" class="tb-btn big">⟳ 重试</button>
      </div>
      <div id="browser-empty">
        <div class="be-icon">🌐</div>
        <div class="be-title">内置浏览器</div>
        <div class="be-sub">在 IDE 内直接浏览网页 · 登录状态自动保留 · 新窗口链接用系统浏览器打开</div>
        <div class="be-section">收藏</div>
        <div class="be-chips" id="be-favs"></div>
        <div class="be-section">最近访问</div>
        <div class="be-list" id="be-history"></div>
      </div>
    </div>
  </div>
</div>
<footer id="statusbar"><span id="sb-branch"></span><span id="sb-info"></span><span id="sb-font" class="sb-font" title="调整编辑区字体大小（Ctrl+= / Ctrl+-）"><button id="sb-font-dec" title="减小字号">−</button><span id="sb-font-val">13</span><button id="sb-font-inc" title="增大字号">＋</button></span><span id="sb-bgop" title="背景图透明度（设置背景图后显示）"><input id="sb-bgop-range" type="range" min="5" max="50" step="1" value="15"></span></footer>
<div id="ctx-menu" class="hidden"></div>
<div id="modal-mask" class="hidden">
  <div id="modal-box"></div>
</div>
<div id="toast-wrap"></div>

<script src="theme.js"></script>
<script src="vendor/cm6-bundle.min.js"></script>
<script src="md-editor.js"></script>
<script src="vendor/marked.min.js"></script>
<script src="vendor/highlight.min.js"></script>
<script src="plugin-loader.js"></script>
<script src="pet.js"></script>
<script src="tree.js"></script>
<script src="viewer.js"></script>
<script src="outline.js"></script>
<script src="git-panel.js"></script>
<script src="quickopen.js"></script>
<script src="search.js"></script>
<script src="session.js"></script>
<script src="shortcuts.js"></script>
<script src="settings.js"></script>
<script src="help.js"></script>
<script src="browser.js"></script>
<script src="app.js"></script>
</body>
</html>
